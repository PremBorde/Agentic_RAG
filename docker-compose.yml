version: "3.8"

services:
  agent-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal_ai_agent_studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
    env_file:
      - .env
    volumes:
      # Persistent storage for SQLite database (agent_studio.db) and FAISS index
      - agent_studio_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  agent_studio_data:
    name: personal_ai_agent_studio_data

